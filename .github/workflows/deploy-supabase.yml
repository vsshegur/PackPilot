name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Configure and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out PackPilot
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate repository secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$CLEANUP_SECRET" || (echo "Missing CLEANUP_SECRET" && exit 1)

      - name: Configure PackPilot function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            FIREBASE_PROJECT_ID="labelcutter-f7eb6" \
            ALLOWED_ORIGINS="https://packpilotin.vercel.app" \
            CLEANUP_SECRET="$CLEANUP_SECRET"

      - name: Deploy PDF gateway
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy pdf-gateway --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy expiry cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy delete-expired-pdfs --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
